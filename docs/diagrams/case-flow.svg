<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Case states and who acts</title>
  <desc id="d">A case starts as new. The handler opens it and it is in review. The handler approves and it is handed over. The specialist then accepts it, which ends the flow, or returns it with a reason. A returned case goes back to the handler, who works on it again. A case returned a second time goes to the team lead.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4338ca"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#fafafa"/>
  <text x="40" y="60" font-size="26" font-weight="700" fill="#27272a">Five states, and who moves a case between them</text>
  <text x="40" y="92" font-size="17" fill="#52525b">The flow ends when a specialist accepts. Closing the complaint itself is outside the prototype.</text>

  <g stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M240 245 H348"/><path d="M530 245 H638"/><path d="M820 245 H928"/>
    <path d="M730 290 V398"/>
  </g>
  <path d="M640 445 H440 V292" stroke="#4338ca" stroke-width="2" fill="none" marker-end="url(#b)"/>

  <g font-size="18" font-weight="700" fill="#27272a" text-anchor="middle">
    <rect x="60" y="200" width="180" height="90" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/><text x="150" y="252">new</text>
    <rect x="350" y="200" width="180" height="90" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/><text x="440" y="252">in_review</text>
    <rect x="640" y="200" width="180" height="90" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/><text x="730" y="252">handed_over</text>
    <rect x="930" y="200" width="180" height="90" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/><text x="1020" y="252" fill="#4338ca">accepted</text>
    <rect x="640" y="400" width="180" height="90" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/><text x="730" y="452">returned</text>
  </g>

  <g font-size="16" text-anchor="middle" fill="#27272a">
    <text x="294" y="228">open</text><text x="294" y="270" fill="#52525b">handler</text>
    <text x="584" y="228">approve</text><text x="584" y="270" fill="#52525b">handler</text>
    <text x="874" y="228">accept</text><text x="874" y="270" fill="#52525b">specialist</text>
  </g>
  <g font-size="16" fill="#27272a">
    <text x="748" y="340">return, with a reason</text><text x="748" y="364" fill="#52525b">specialist</text>
    <text x="456" y="430" fill="#4338ca">back to the queue</text><text x="456" y="470" fill="#4338ca">handler</text>
  </g>

  <text x="40" y="550" font-size="16" fill="#27272a">A case returned a second time goes to the team lead. Every move writes an audit entry.</text>
</svg>
