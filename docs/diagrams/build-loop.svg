<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How the prototype was built: a closed loop</title>
  <desc id="d">A controller plans a task. A builder agent builds it with tests. A reviewer model, Sonnet, reads the result. If the reviewer finds defects, a fix round goes back to the builder, up to three rounds. When the review is clean the result goes into the ledger, and at the end a final review covers the whole branch. A local Qwen model records the drafts, outside the loop.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52525b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4338ca"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#fafafa"/>
  <text x="40" y="60" font-size="26" font-weight="700" fill="#27272a">Build, review, fix, record</text>
  <text x="40" y="92" font-size="17" fill="#52525b">Each task closes only when a separate read-only reviewer has passed it. Three failed rounds stop the loop.</text>

  <g stroke="#52525b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M220 190 H273"/><path d="M455 190 H508"/><path d="M690 190 H743"/><path d="M925 190 H978"/>
  </g>
  <g stroke="#4338ca" stroke-width="2" fill="none" marker-end="url(#b)">
    <path d="M600 240 V338"/>
    <path d="M510 390 H365 V242"/>
  </g>

  <g font-size="18" font-weight="700" fill="#27272a" text-anchor="middle">
    <rect x="40" y="140" width="180" height="100" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="130" y="184">Plan</text><text x="130" y="214" font-size="16" font-weight="400" fill="#52525b">controller</text>
    <rect x="275" y="140" width="180" height="100" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="365" y="184">Builder</text><text x="365" y="214" font-size="16" font-weight="400" fill="#52525b">agent, tests first</text>
    <rect x="510" y="140" width="180" height="100" rx="14" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
    <text x="600" y="184" fill="#4338ca">Reviewer</text><text x="600" y="214" font-size="16" font-weight="700" fill="#4338ca">Sonnet, read-only</text>
    <rect x="745" y="140" width="180" height="100" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="835" y="184">Ledger</text><text x="835" y="214" font-size="16" font-weight="400" fill="#52525b">progress.md</text>
    <rect x="980" y="140" width="180" height="100" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="1070" y="184">Final review</text><text x="1070" y="214" font-size="16" font-weight="400" fill="#52525b">whole branch</text>

    <rect x="510" y="340" width="180" height="100" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="600" y="384">Fix round</text><text x="600" y="414" font-size="16" font-weight="400" fill="#52525b">up to 3 rounds</text>

    <rect x="980" y="340" width="180" height="100" rx="14" fill="#fff" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1070" y="384">Local Qwen</text><text x="1070" y="414" font-size="16" font-weight="400" fill="#52525b">records drafts</text>
  </g>

  <g font-size="16" fill="#27272a">
    <text x="702" y="178" text-anchor="start">clean</text>
    <text x="616" y="296" fill="#4338ca">defects found</text>
    <text x="150" y="345" fill="#4338ca">same builder, next round</text>
  </g>

  <text x="40" y="510" font-size="16" fill="#27272a">Qwen sits outside the loop: it does one bounded job, recorded in advance. The dashed box is not a reviewer.</text>
  <text x="40" y="545" font-size="16" fill="#52525b">Boxes show the role and model tier. Figures per task are in docs/loop-log.md.</text>
</svg>
