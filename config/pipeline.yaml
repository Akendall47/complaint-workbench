today: 2026-11-10
demo_case: AB-2026-00768  # the walk-through and the browser tests use this case
# Dates fetched from https://www.gov.uk/bank-holidays.json (england-and-wales) on 2026-11-10.
bank_holidays:
  - 2026-01-01
  - 2026-04-03
  - 2026-04-06
  - 2026-05-04
  - 2026-05-25
  - 2026-08-31
  - 2026-12-25
  - 2026-12-28
  - 2027-01-01
  - 2027-03-26
  - 2027-03-29
  - 2027-05-03
  - 2027-05-31
  - 2027-08-30
  - 2027-12-27
  - 2027-12-28
departments:
  Fraud claims:
    required_fields: [amount_disputed, date_of_transaction, merchant_name, card_last_four, police_reference]
  Financial difficulty:
    required_fields: [monthly_income, monthly_outgoings, total_arrears, vulnerability_noted, payment_plan_offered]
  Bereavement:
    required_fields: [date_of_death, executor_name, relationship_to_deceased, accounts_affected, death_certificate_seen]
  Data protection:
    required_fields: [data_requested, request_date, identity_verified, systems_searched]
  Mis-selling review:
    required_fields: [product_name, date_of_sale, sale_channel, adviser_name, amount_lost, loss_explained]
  General service:
    required_fields: [issue_summary, date_of_incident, branch_or_channel, customer_outcome_wanted]
sources: [phone, mobile app, secure message, branch, letter, email]
types:
  - Website or app
  - Service
  - Fees and charges
  - Fraud or security
  - Payment scam
  - Investment advice
  - Account administration
  - Other
deadlines:
  other: {weeks: 8}
  payment: {business_days: 15, extended_business_days: 35}
routing_threshold: 0.45
urgent:
  deadline_within_business_days: 5
  vulnerability_terms: [bereaved, terminally ill, cancer, mental health, dementia, carer, domestic abuse, lost my job, suicidal, disability]
  hardship_terms: [cannot afford, can't afford, no money, food bank, eviction, rent arrears, bailiffs, repossession, behind on payments, struggling to pay]
  fraud_terms: [scam, fraudster, unauthorised transaction, did not make this payment, account taken over, stolen card, phishing, cloned, impersonat]
rise: {ratio: 2.0, minimum_cases: 10, baseline_weeks: 4}
masking:
  # Shared separator class [ .-]: space, dot, hyphen (card also takes / and _). Dates, times and money are held before the patterns run.
  email: '(?<![\w.+-])[\w.+-]+@[\w-]+(?:\.[\w-]+)+'
  card: '(?<!\d)(?!\d{2}[ .-]\d{2}[ .-]\d{2}[ .-]\d{8}(?!\d))\d(?:[ ./_-]?\d){12,}(?!\d)'
  sort_code_account: '(?<!\d)\d{2}[ .-]\d{2}[ .-]\d{2} \d{8}(?!\d)'
  sort_code: '(?<!\d)\d{2}[ .-]\d{2}[ .-]\d{2}(?!\d)'
  account: '(?<!\d)\d{8}(?!\d)'
  phone: '(?:\+44[ .-]?\(?0?\)?[ .-]?|(?<!\d)0)[1-9]\d{1,3}(?:[ .-]?\d{3,4}){2}(?!\d)'
  postcode: '\b[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}\b'
  number: '\d{9,}'
model: qwen3:4b-instruct
prompt_version: 2
stages: [new, in_review, handed_over, returned, accepted]
paths:
  - {from: new, to: in_review, kind: normal}
  - {from: new, to: in_review, kind: urgent}
  - {from: in_review, to: handed_over, kind: normal}
  - {from: in_review, to: handed_over, kind: urgent}
  - {from: handed_over, to: accepted, kind: normal}
  - {from: handed_over, to: returned, kind: returned}
  - {from: returned, to: in_review, kind: returned}
  - {from: returned, to: team lead review, kind: second_return}
data_sources:
  # Public sources the demo follows. Only figures checked at source on 11 Nov 2026 (sources-report.md); nothing is fetched at page load.
  public:
    - follows: "Complaint clocks: a final response within 8 weeks; for payment services, a response normally within 15 business days and a final response within 35 business days"
      source: "FCA, How to complain"
      date: "Updated 20 May 2025"
      url: "https://www.fca.org.uk/consumers/how-complain"
    - follows: "UK complaint volume, closure speed and upheld rate: 1.85 million complaints in Jan to Jun 2026, up 6.3% on H2 2025; 44.8% closed within 3 days and 94.5% within 8 weeks; 54.8% upheld. Current accounts were the most complained about"
      source: "FCA, Complaints data 2026 H1"
      date: "22 Oct 2026"
      url: "https://www.fca.org.uk/data/complaints-data-2026-h1"
    - follows: "Banking's share of complaints: banking and credit cards were 857,757 of 1,740,909 complaints, 49% (share worked out here)"
      source: "FCA, Aggregate complaints data 2025 H2"
      date: "H2 2025 data"
      url: "https://www.fca.org.uk/data/aggregate-complaints-data-2025-h2"
    - follows: "Fraud and scams are a large share of current-account complaints: 18,900 of 32,900 cases at the ombudsman in 2025/26"
      source: "Financial Ombudsman Service, Annual complaints data 2025/26"
      date: "21 May 2026"
      url: "https://www.financial-ombudsman.org.uk/data-insight/our-insight/annual-complaints-data-and-insight-2025-26"
    - follows: "Fraud volumes in 2025: authorised push payment fraud £576.4m in 248,070 cases; unauthorised fraud £703.4m in 3.81m cases"
      source: "UK Finance, Fraud Report 2026"
      date: "15 Jun 2026"
      url: "https://www.ukfinance.org.uk/news-and-insight/press-release/fraud-report-2026-press-release"
    - follows: "Vulnerable customers: “especially susceptible to harm …”, the definition behind the urgent rule"
      source: "FCA, FG21/1 guidance for firms"
      date: "23 Feb 2021"
      url: "https://www.fca.org.uk/publications/finalised-guidance/guidance-firms-fair-treatment-vulnerable-customers"
    - follows: "Authorised push payment reimbursement: from 7 Oct 2024, a cap of £85,000 and an outcome within 35 business days"
      source: "Payment Systems Regulator, APP fraud reimbursement"
      date: "In force 7 Oct 2024"
      url: "https://www.psr.org.uk/information-for-consumers/app-fraud-reimbursement-protections/"
  # Our own choices, no public source. The generator and the handover rules use them.
  assumptions:
    - {what: "Channel mix", note: "how many complaints come by phone, email, app, secure message, branch and letter"}
    - {what: "Hour-of-day pattern", note: "busiest from 9 to 11 in the morning"}
    - {what: "Volume ramp", note: "recent weeks are busier than older ones"}
    - {what: "Return rate", note: "34% of handovers are sent back for more information"}
    - {what: "Handover field list", note: "the fields each department needs before it can take a case"}
    - {what: "Open share", note: "about 80% of cases are still open"}
