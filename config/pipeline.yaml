today: 2026-11-10
# Dates fetched from https://www.gov.uk/bank-holidays.json (england-and-wales) on 2026-11-10.
bank_holidays:
  - 2026-01-01
  - 2026-04-03
  - 2026-04-06
  - 2026-05-04
  - 2026-05-25
  - 2026-08-31
  - 2026-12-25
  - 2026-12-28
  - 2027-01-01
  - 2027-03-26
  - 2027-03-29
  - 2027-05-03
  - 2027-05-31
  - 2027-08-30
  - 2027-12-27
  - 2027-12-28
departments:
  Fraud claims:
    required_fields: [amount_disputed, date_of_transaction, merchant_name, card_last_four, police_reference]
  Financial difficulty:
    required_fields: [monthly_income, monthly_outgoings, total_arrears, vulnerability_noted, payment_plan_offered]
  Bereavement:
    required_fields: [date_of_death, executor_name, relationship_to_deceased, accounts_affected, death_certificate_seen]
  Data protection:
    required_fields: [data_requested, request_date, identity_verified, systems_searched]
  Mis-selling review:
    required_fields: [product_name, date_of_sale, sale_channel, adviser_name, amount_lost, loss_explained]
  General service:
    required_fields: [issue_summary, date_of_incident, branch_or_channel, customer_outcome_wanted]
sources: [phone, mobile app, secure message, branch, letter, email]
types:
  - Website or app
  - Service
  - Fees and charges
  - Fraud or security
  - Payment scam
  - Investment advice
  - Account administration
  - Other
deadlines:
  other: {weeks: 8}
  payment: {business_days: 15, extended_business_days: 35}
routing_threshold: 0.45
urgent:
  deadline_within_business_days: 5
  vulnerability_terms: [bereaved, terminally ill, cancer, mental health, dementia, carer, domestic abuse, lost my job, suicidal, disability]
  hardship_terms: [cannot afford, can't afford, no money, food bank, eviction, rent arrears, bailiffs, repossession, behind on payments, struggling to pay]
  fraud_terms: [scam, fraudster, unauthorised transaction, did not make this payment, account taken over, stolen card, phishing, cloned, impersonat]
  classifier_threshold: 0.7
rise: {ratio: 2.0, minimum_cases: 10, baseline_weeks: 4}
masking:
  card: '\b(?:\d[ -]?){13,16}\b'
  account: '\b\d{8}\b'
  sort_code: '\b\d{2}-\d{2}-\d{2}\b'
  phone: '(?:\+44\s?7\d{3}|\b07\d{3})\s?\d{3}\s?\d{3}\b'
  email: '\b[\w.+-]+@[\w-]+\.[\w.-]+\b'
  postcode: '\b[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}\b'
model: qwen3:4b-instruct
prompt_version: 1
stages: [new, in_review, handed_over, returned, accepted]
paths:
  - {from: new, to: in_review, kind: normal}
  - {from: new, to: in_review, kind: urgent}
  - {from: in_review, to: handed_over, kind: normal}
  - {from: in_review, to: handed_over, kind: urgent}
  - {from: handed_over, to: accepted, kind: normal}
  - {from: handed_over, to: returned, kind: returned}
  - {from: returned, to: in_review, kind: returned}
  - {from: returned, to: team lead review, kind: second_return}
data_sources:
  - {data: Complaint cases, prototype: Generated by workbench.generate from a fixed seed, real_bank: The bank's complaints system, personal_data: None. All names and details are invented, refresh: Regenerated on demand}
  - {data: Case notes, prototype: Written from templates by the generator, real_bank: Handler notes typed in the case system, personal_data: None. Invented text only, refresh: Regenerated with the cases}
  - {data: Policy clauses, prototype: About 40 fictional clauses in policies.yaml, real_bank: The bank's complaints and conduct policies, personal_data: None, refresh: Edited by hand}
  - {data: Draft summaries, prototype: Recorded once from a local model and replayed, real_bank: Live model call on a bank-hosted server, personal_data: None. Input is masked first, refresh: Re-recorded with workbench.record}
  - {data: Bank holidays, prototype: Fetched from gov.uk for England and Wales 2026 and 2027, real_bank: Same public list, personal_data: None, refresh: Yearly}
  - {data: Staff, prototype: Eight handlers and three specialists and one team lead all invented, real_bank: The bank's HR directory, personal_data: None. Invented names, refresh: Regenerated with the cases}
