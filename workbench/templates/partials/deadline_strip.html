<ul class="strip" aria-label="Deadlines">
  <li><a href="/queue?owner=all&amp;due=past" class="{{ 'bad' if strip.past }}">Past deadline <b>{{ strip.past }}</b></a></li>
  <li><a href="/queue?owner=all&amp;due=soon">Due within {{ strip.limit }} business days <b>{{ strip.soon }}</b></a></li>
  <li><a href="/queue?owner=all&amp;urgent=1">Urgent <b>{{ strip.urgent }}</b></a></li>
  {% if strip.rises %}<li><a href="/queue?{{ strip.rise_query }}">Rises <b>{{ strip.rises }}</b></a></li>{% endif %}
  <li class="muted">Updated {{ strip.updated }}</li>
</ul>
